[package]
name = "cargo-ohos"
description = "Cargo subcommand to cross-compile Rust for OpenHarmony"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openharmony-rs/cargo-ohos"
rust-version = "1.85"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "cargo-ohos"
description = "Cargo subcommand to cross-compile Rust for OpenHarmony"
version = "0.3.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openharmony-rs/cargo-ohos"
rust-version = "1.88"
readme = "README.md"
# The integration tests need an OpenHarmony SDK, a device or the fixture projects, which are
# cargo packages of their own. None of it is usable from the published crate, so the whole
# directory stays out rather than only the parts the test sources read.
exclude = ["tests"]

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs4 = { version = "1", features = ["sync"] }
indicatif = { version = "0.18.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
md-5 = "0.11"

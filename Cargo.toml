[package]
name = "cargo-ohos"
description = "Cargo subcommand to cross-compile Rust for OpenHarmony"
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openharmony-rs/cargo-ohos"
rust-version = "1.88"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs4 = { version = "1", features = ["sync"] }
indicatif = { version = "0.18.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }

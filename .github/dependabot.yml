version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  # The tools CI installs, see .github/ci-tools/Cargo.toml.
  - package-ecosystem: cargo
    directory: "/.github/ci-tools"
    schedule:
      interval: weekly
  # SpiderMonkey, see .github/mozjs-smoke/Cargo.toml.
  - package-ecosystem: cargo
    directory: "/.github/mozjs-smoke"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

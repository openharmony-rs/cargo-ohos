name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in sync with rust-version in Cargo.toml.
  MSRV: "1.88"

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just
      - run: just lint
      - run: cargo build
      # The matrix tests need an SDK and skip themselves here; the rest is hermetic.
      - run: just test

  # The fixture projects in tests/projects, cross-compiled and - where a device of the
  # target's architecture is attached - run on it. The entries differ in the host and in
  # which device the runner can reach; the tests match cases to devices themselves.
  matrix:
    name: fixtures (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oniro-emulator
            runs-on: ubuntu-latest
            emulator: true
            # The emulator is x86_64; the other targets are built and inspected only.
            require_device_arches: x86_64
          - name: macos
            runs-on: macos-latest
          - name: windows
            runs-on: windows-latest
          # Add a board here once it is wired up to a self-hosted runner, e.g.
          # - name: dayu200
          #   runs-on: [self-hosted, dayu200]
          #   emulator: false
          #   require_device_arches: aarch64
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Not through a job `env` named TARGETS: Windows environment names ignore case, so
          # that would hide the action's own `targets` from its bash script.
          targets: aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos,x86_64-unknown-linux-ohos
      - uses: taiki-e/install-action@just
      - name: Download the OpenHarmony SDK
        env:
          # For cargo-ohos and `gh` alike: lifts GitHub's anonymous rate limit, and lets `gh`
          # look up the archive's attestation.
          GITHUB_TOKEN: ${{ github.token }}
        # native = clang + sysroot + cmake, toolchains = hdc.
        run: cargo run --locked -- ohos init sdk --version 6.1 --components native,toolchains
      # `-j` rather than `-r`, as jq on Windows would end the line with a CR.
      - name: Add hdc to PATH
        id: sdk
        run: |
          native=$(cargo run --locked -q -- ohos env --format json | jq -j .sdk.native_root)
          echo "${native%native}toolchains" >> "$GITHUB_PATH"
          echo "native=$native" >> "$GITHUB_OUTPUT"
      # Only needed to run on a device.
      - if: matrix.require_device_arches
        uses: taiki-e/install-action@cargo-binstall
      - name: Install ohos-test-runner
        if: matrix.require_device_arches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ohos-test-runner = "=\(.*\)"$/\1/p' .github/ci-tools/Cargo.toml)
          cargo binstall --no-confirm --disable-strategies quick-install,compile \
            ohos-test-runner --version "${version:?not pinned in .github/ci-tools/Cargo.toml}"
      # Without it the emulator falls back to TCG, where ohos-test-runner's device lock
      # queues for tens of seconds.
      - name: Enable KVM
        if: matrix.emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the Oniro emulator
        id: emulator
        if: matrix.emulator
        uses: openharmony-rs/emulator-action@v1
      - name: List the attached devices
        run: hdc list targets
      - name: Run the fixture matrix
        run: just test-matrix -- --test-threads=4
        env:
          CARGO_OHOS_TEST_SDK: ${{ steps.sdk.outputs.native }}
          # Missing prerequisites and unreachable devices fail the job instead of skipping.
          CARGO_OHOS_TEST_REQUIRE: "1"
          CARGO_OHOS_TEST_REQUIRE_DEVICE_ARCHES: ${{ matrix.require_device_arches }}
          CARGO_OHOS_TEST_DOWNLOAD_PREBUILT: "19"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Composite actions cannot register a post: step, so keep the emulator log ourselves.
      - name: Upload the emulator log
        if: always() && matrix.emulator
        uses: actions/upload-artifact@v7
        with:
          name: oniro-emulator-log-${{ matrix.name }}
          path: ${{ steps.emulator.outputs.log-path }}
          if-no-files-found: warn
